<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAPPY DIWALI</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--sky:#0a0420;--gold:#ffc83d;--flame:#ff7a1a;--rose:#ff3d71;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--sky);overflow:hidden;font-family:'Yatra One',Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}#fg{z-index:3;pointer-events:none}
#title{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 4vw}
.row{display:flex;gap:.04em;font-size:clamp(46px,15vw,170px);line-height:1.02;color:var(--gold);text-shadow:0 0 18px var(--flame),0 0 50px rgba(255,122,26,.7),0 4px 0 #8a3c00}
.row span{display:inline-block;opacity:0;transform:translateY(60px) scale(.4) rotate(-12deg);animation:pop .9s cubic-bezier(.2,1.6,.4,1) forwards,glow 2.4s ease-in-out 1.6s infinite alternate}
.row.b{color:#fff1c2}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.35)}}
#gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 60%,#2a0d4a,#0a0420 70%);transition:opacity .8s}
#gate.off{opacity:0;pointer-events:none}
#gate button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--gold);font-size:22px;padding:24px}
#gate button:focus-visible{outline:3px solid var(--gold);border-radius:16px}
.diya{font-size:96px;animation:flick 1.2s ease-in-out infinite alternate;filter:drop-shadow(0 0 24px var(--flame))}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.12) rotate(3deg)}}
#restart,#pause,#play{all:unset;box-sizing:border-box;cursor:pointer;position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:28px/1 Georgia,serif;color:var(--gold);background:rgba(10,4,32,.55);border:1.5px solid rgba(255,200,61,.65);backdrop-filter:blur(4px);transition:transform .3s}
#restart:hover{transform:rotate(-180deg)}
#restart:focus-visible,#pause:focus-visible,#play:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#wish{margin:22px 0 0;max-width:20em;min-height:3.2em;font-size:clamp(17px,4.6vw,32px);line-height:1.35;color:#ffe9b0;text-wrap:balance;text-shadow:0 0 14px rgba(255,122,26,.9),0 2px 6px rgba(0,0,0,.6);opacity:0;transition:opacity .7s}
#wish.show{opacity:1}
#pause,#play{font-size:17px;letter-spacing:-2px;text-indent:-1px}
#pause{right:66px}#play{right:120px;text-indent:2px;letter-spacing:0}
body.paused .row span,body.paused .diya{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.row span{animation:pop .01s forwards}.diya{animation:none}}
</style></head><body>
<canvas id="bg"></canvas>
<div id="title"><div class="row" id="r1"></div><div class="row b" id="r2"></div><p id="wish" aria-live="polite"></p></div>
<canvas id="fg"></canvas>
<div id="gate"><button id="open" aria-label="Open greeting"><span class="diya">🪔</span><span>Tap to open</span></button></div>
<button id="restart" aria-label="Restart" title="Restart">↻</button>
<button id="play" aria-label="Play" title="Play">&#9654;&#xFE0E;</button>
<button id="pause" aria-label="Pause" title="Pause">&#10074;&#10074;</button>

<script>
const $=id=>document.getElementById(id);
function letters(el,t,d0){[...t].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=(d0+i*.09)+'s,'+(1.6+i*.15)+'s';el.appendChild(s)})}
letters($('r1'),'HAPPY',.3);letters($('r2'),'DIWALI',1);
const bg=$('bg'),fg=$('fg'),b=bg.getContext('2d'),f=fg.getContext('2d');
let W,H,D;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;[bg,fg].forEach(c=>{c.width=W*D;c.height=H*D});b.setTransform(D,0,0,D,0,0);f.setTransform(D,0,0,D,0,0)}
size();addEventListener('resize',size);
const stars=Array.from({length:140},()=>({x:Math.random(),y:Math.random()*.8,r:Math.random()*1.6+.3,p:Math.random()*6}));
let rockets=[],sparks=[],t0=0,started=false;
const cols=['#ffc83d','#ff7a1a','#ff3d71','#7df9ff','#b388ff','#ffffff'];
function launch(){const x=W*(.12+Math.random()*.76);rockets.push({x,y:H,ty:H*(.12+Math.random()*.35),v:H*.011+Math.random()*3,c:cols[Math.random()*6|0]})}
function burst(x,y,c){const n=70;for(let i=0;i<n;i++){const a=i/n*6.283,s=1.5+Math.random()*3.5;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:Math.random()<.3?'#fff':c})}}
function sky(t){
 const g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05020f');g.addColorStop(.6,'#1b0b3d');g.addColorStop(1,'#5a1a4a');
 b.fillStyle=g;b.fillRect(0,0,W,H);
 stars.forEach(s=>{b.globalAlpha=.4+.6*Math.abs(Math.sin(t/700+s.p));b.fillStyle='#fff';b.beginPath();b.arc(s.x*W,s.y*H,s.r,0,6.283);b.fill()});
 b.globalAlpha=1;b.fillStyle='#fff3c4';b.beginPath();b.arc(W*.82,H*.14,Math.min(W,H)*.05,0,6.283);b.fill();
 b.globalAlpha=.25;b.fillStyle='#ffd27a';b.beginPath();b.arc(W*.82,H*.14,Math.min(W,H)*.09,0,6.283);b.fill();b.globalAlpha=1;
 if(started&&Math.random()<.045)launch();
 rockets=rockets.filter(r=>{r.y-=r.v;r.v*=.985;b.fillStyle=r.c;b.fillRect(r.x-1.5,r.y,3,14);if(r.y<=r.ty||r.v<2){burst(r.x,r.y,r.c);return false}return true});
 sparks=sparks.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy=s.vy*.985+.04;s.l-=.012;b.globalAlpha=Math.max(s.l,0);b.fillStyle=s.c;b.beginPath();b.arc(s.x,s.y,2.2,0,6.283);b.fill();return s.l>0});
 b.globalAlpha=1;
}
const fl=[];const em=['❤️','🪔','💖','🪔','✨','🧡'];
const em2=['🪔','❤️','💖','✨','🎆','🎇','🧨','🪷','🌟','🎉','🎊','🧡','💛','🌸','🍬','🥳','😊','😍','🙏','🔥','🎁','🌼','💫','🪁','🪅'];
function spawn(){fl.push({x:Math.random()*W,y:H+40,s:18+Math.random()*34,v:.6+Math.random()*1.4,w:Math.random()*6,a:.5+Math.random()*1.2,sp:(Math.random()-.5)*.05,e:em2[Math.random()*em2.length|0]})}
function front(t){
 f.clearRect(0,0,W,H);
 if(started&&Math.random()<.2)spawn();
 for(let i=fl.length-1;i>=0;i--){const o=fl[i];let x;if(o.b){o.x+=o.vx;o.y+=o.vy;o.vy+=.22;o.l-=.012;x=o.x}else{o.y-=o.v;x=o.x+Math.sin((o.w+=.02))*28*o.a}o.r=(o.r||0)+(o.sp||0);
  f.globalAlpha=o.b?Math.max(0,o.l):Math.min(1,o.y/(H*.2));f.font=o.s+'px serif';f.textAlign='center';f.save();f.translate(x,o.y);f.rotate(o.r);f.fillText(o.e,0,0);f.restore();
  if(o.y<-50||(o.b&&(o.l<=0||o.y>H+60)))fl.splice(i,1)}
 f.globalAlpha=1;
 const bs=Math.min(W/9,64);f.font=bs+'px serif';
 for(let i=0;i<9;i++){const x=(i+.5)*W/9,y=H-12-Math.sin(t/260+i)*3;f.shadowColor='#ff7a1a';f.shadowBlur=22;f.fillText('🪔',x,y);f.shadowBlur=0}
}
let paused=false;function loop(t){if(!paused){sky(t);front(t)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
const AC=window.AudioContext||window.webkitAudioContext;
let ctx,buf1,buf2,s1,s2,loaded=null;
try{navigator.audioSession.type='playback'}catch(e){}
function b64buf(id){const s=atob($(id).textContent.trim()),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function decode(ab){return new Promise((res,rej)=>{const p=ctx.decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(rej)})}
function load(){if(!loaded)loaded=Promise.all([decode(b64buf('d1')),decode(b64buf('d2'))]).then(r=>{buf1=r[0];buf2=r[1]});return loaded}
function stopAll(){[s1,s2].forEach(s=>{try{s&&s.stop()}catch(e){}});s1=s2=null}
async function playAudio(){
 try{
  if(!ctx)ctx=new AC();
  ctx.resume();await load();stopAll();
  const X=1.6,t=ctx.currentTime+.08,t2=t+buf1.duration-X;
  const g1=ctx.createGain(),g2=ctx.createGain();g1.connect(ctx.destination);g2.connect(ctx.destination);
  s1=ctx.createBufferSource();s1.buffer=buf1;s1.connect(g1);s1.start(t);
  s2=ctx.createBufferSource();s2.buffer=buf2;s2.loop=true;s2.connect(g2);
  g1.gain.setValueAtTime(1,t2);g1.gain.linearRampToValueAtTime(0,t2+X);
  g2.gain.setValueAtTime(0,t2);g2.gain.linearRampToValueAtTime(1,t2+X);
  s2.start(t2);
 }catch(e){console.error('audio',e)}
}
$('open').onclick=()=>{
 if(!ctx){try{ctx=new AC();ctx.resume()}catch(e){}}
 $('gate').classList.add('off');started=true;startWishes();
 for(let i=0;i<3;i++)setTimeout(launch,i*350);
 playAudio();
};
addEventListener('pointerdown',e=>{if(!started||paused||e.target.closest('button'))return;for(let i=0;i<16;i++){const a=Math.random()*6.283,s=3+Math.random()*7;fl.push({b:1,x:e.clientX,y:e.clientY,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,l:1.4,s:22+Math.random()*28,sp:(Math.random()-.5)*.3,e:em2[Math.random()*em2.length|0]})}});
$('pause').onclick=()=>{
 if(!started||paused)return;
 paused=true;document.body.classList.add('paused');ctx&&ctx.suspend();
};
$('play').onclick=()=>{
 if(!started||!paused)return;
 paused=false;document.body.classList.remove('paused');ctx&&ctx.resume();
};
const wishes=['May this Diwali light up your life with joy and peace.','May every diya bring you health, love and laughter.','Wishing you success, prosperity and endless smiles.','Let the light within you outshine every darkness.','May your home glow with happiness all year long.','Good days are coming. Keep your light burning bright.'];
let wi=0,wt=null;
